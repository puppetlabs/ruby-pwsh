name: "ci"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (e.g. a fork PR, which gets no secrets via the normal pull_request trigger)"
        required: false
        type: string
      ref:
        description: "Branch or SHA to test (ignored if pr_number is set)"
        required: false
        type: string

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/merge"
          else
            ref="$INPUT_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ -n "$ref" ]; then
            echo "Testing ref: $ref" >> "$GITHUB_STEP_SUMMARY"
          fi

  spec:
    needs: resolve-ref
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - '3.2'
          - '4.0'
        include:
          - ruby_version: '3.2'
            puppet_version: '~> 8.17'
          - ruby_version: '4.0'
            puppet_version: '~> 9.0'
    name: "spec (ruby ${{ matrix.ruby_version }} | puppet ${{ matrix.puppet_version }})"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_ci.yml@main"
    secrets: "inherit"
    with:
      rake_task: "spec:coverage"
      ruby_version: ${{ matrix.ruby_version }}
      puppet_gem_version: ${{ matrix.puppet_version }}
      ref: ${{ needs.resolve-ref.outputs.ref }}

  acceptance:
    needs: ["resolve-ref", "spec"]
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - "3.2"
          - "4.0"
        include:
          - ruby_version: '3.2'
            puppet_version: '~> 8.17'
          - ruby_version: '4.0'
            puppet_version: '~> 9.0'
        runs_on:
          - "windows-latest"
    name: "acceptance (${{ matrix.runs_on}} ruby ${{ matrix.ruby_version }} | puppet ${{ matrix.puppet_version }})"
    uses: "./.github/workflows/custom_acceptance.yml"
    secrets: "inherit"
    with:
      ruby_version: ${{ matrix.ruby_version }}
      puppet_version: ${{ matrix.puppet_version }}
      runs_on: ${{ matrix.runs_on }}
      ref: ${{ needs.resolve-ref.outputs.ref }}
